<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Barbearia Alpha</title>
<style>
:root{--gold:#c48a22;--gold2:#e1ad50;--ink:#050505}
*{box-sizing:border-box}
html,body{margin:0;background:#050505;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden}
.page{min-height:100vh;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 12%,rgba(196,138,34,.13),transparent 30%),#050505}
.rain{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.column{position:absolute;top:-55vh;width:175px;display:flex;flex-direction:column;gap:60px;opacity:.42;animation:fall linear infinite}
.column img{width:100%;height:auto;display:block}
.c1{left:-15px;animation-duration:25s;animation-delay:-11s}
.c2{left:24%;width:145px;animation-duration:31s;animation-delay:-19s}
.c3{right:12%;width:160px;animation-duration:28s;animation-delay:-8s}
.c4{right:-30px;width:185px;animation-duration:34s;animation-delay:-25s}
@keyframes fall{from{transform:translateY(-20vh)}to{transform:translateY(150vh)}}
.content{position:relative;z-index:2;width:min(420px,100%);margin:auto;padding:28px 20px 48px}
.brand{display:flex;align-items:center;justify-content:center;min-height:190px;margin-bottom:2px}
.brand img{display:block;width:min(70vw,300px);max-height:190px;height:auto;object-fit:contain;filter:drop-shadow(0 10px 25px rgba(0,0,0,.65));animation:logoIn .7s ease-out both}
@keyframes logoIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.tag{margin:0 0 24px;text-align:center;color:rgba(255,255,255,.60);font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase}
.actions{display:grid;gap:12px}
.btn{width:100%;min-height:58px;border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:11px;color:#fff;text-decoration:none;background:rgba(255,255,255,.045);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 30px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.06);font-size:15px;font-weight:800;cursor:pointer;transition:.18s ease}
.btn.primary{border-color:rgba(225,173,80,.60);background:rgba(196,138,34,.13)}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:rgba(225,173,80,.75);background:rgba(196,138,34,.10);outline:none}
.btn:active{transform:scale(.985)}
.icon{width:22px;height:22px;flex:0 0 22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wifi{margin-top:14px;padding:16px;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:rgba(255,255,255,.035);backdrop-filter:blur(12px);text-align:center}
.wifi-title{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:900;letter-spacing:1.7px;text-transform:uppercase}
.info{margin-top:9px;color:rgba(255,255,255,.58);font-size:12px;line-height:1.6}
.info b{color:#fff}
.mini{margin-top:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:#fff;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800}
.footer{margin-top:27px;text-align:center;color:rgba(255,255,255,.27);font-size:9px;font-weight:800;letter-spacing:3px}
.toast{position:fixed;left:50%;bottom:22px;z-index:20;transform:translate(-50%,20px);opacity:0;background:#151515;color:#fff;border:1px solid rgba(225,173,80,.4);padding:10px 14px;border-radius:12px;font-size:12px;font-weight:800;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.content{padding-left:16px;padding-right:16px}.brand{min-height:175px}.brand img{width:72vw;max-height:175px}}
@media(prefers-reduced-motion:reduce){.column{animation:none}.brand img{animation:none}}
</style>
</head>
